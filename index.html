<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI for Contractors - Video Dashboards</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a1628;color:#e2e8f0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;padding:32px 40px;min-height:100vh}
  .hdr{text-align:center;margin-bottom:32px}
  .hdr h1{font-size:26px;font-weight:700;color:#fff;margin-bottom:6px}
  .hdr p{font-size:13px;color:#64748b}
  .nav{display:flex;gap:8px;justify-content:center;margin-bottom:28px}
  .nav button{padding:10px 24px;border-radius:8px;background:#111d33;color:#94a3b8;font-size:13px;font-weight:600;border:1px solid #1e3a5f;cursor:pointer;transition:all .2s}
  .nav button:hover,.nav button.active{background:#1e3a5f;color:#fff;border-color:#FFF176}
  .kpi-row{display:grid;gap:14px;margin-bottom:32px}
  .c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}
  .kpi{background:#111d33;border-radius:12px;padding:20px;text-align:center;border:1px solid #1e3a5f}
  .kpi .lb{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#64748b;margin-bottom:6px}
  .kpi .vl{font-size:36px;font-weight:800;line-height:1}
  .kpi .sub{font-size:11px;color:#94a3b8;margin-top:5px}
  .y{color:#FFF176}.g{color:#4ade80}.r{color:#f87171}.b{color:#60a5fa}.w{color:#fff}
  .sec{margin-bottom:28px}
  .sec h2{font-size:16px;font-weight:600;color:#fff;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #1e3a5f}
  table{width:100%;border-collapse:collapse}
  th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#64748b;text-align:left;padding:10px 12px;border-bottom:2px solid #1e3a5f}
  td{font-size:13px;padding:10px 12px;border-bottom:1px solid #0f1a2e}
  tr:hover td{background:#111d33}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600}
  .badge-g{background:#052e16;color:#4ade80}.badge-r{background:#450a0a;color:#f87171}
  .badge-y{background:#422006;color:#fbbf24}.badge-b{background:#172554;color:#60a5fa}
  .badge-gr{background:#1e293b;color:#94a3b8}.badge-o{background:#431407;color:#fb923c}
  .money{color:#FFF176;font-weight:700}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .hbox{background:#111d33;border:2px solid #FFF176;border-radius:12px;padding:24px;text-align:center;margin-top:24px}
  .hbox .big{font-size:44px;font-weight:900;color:#FFF176}
  .hbox .desc{font-size:13px;color:#94a3b8;margin-top:4px}
  .chart{display:flex;align-items:flex-end;gap:6px;height:220px;padding:16px 0}
  .bar-col{display:flex;flex-direction:column;align-items:center;flex:1}
  .bar-col .bw{width:100%;display:flex;flex-direction:column;align-items:center;height:180px;justify-content:flex-end}
  .bar-col .br{width:65%;border-radius:4px 4px 0 0;position:relative;transition:height .6s ease}
  .bar-col .bl-t{font-size:10px;font-weight:700;color:#fff;position:absolute;top:-16px;width:100%;text-align:center}
  .bar-col .ml{font-size:10px;color:#64748b;margin-top:6px}
  .util-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .util-bar .nm{width:70px;font-size:12px;color:#94a3b8}
  .util-bar .bg{flex:1;height:22px;background:#1e293b;border-radius:4px;overflow:hidden}
  .util-bar .fl{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:700;color:#fff;transition:width .6s ease}
  .cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:16px 0}
  .cmp-c{background:#111d33;border-radius:12px;padding:20px;text-align:center;border:1px solid #1e3a5f}
  .cmp-c.bad{border-color:#991b1b}.cmp-c.good{border-color:#166534}
  .cmp-c .cl{font-size:11px;color:#64748b;margin-bottom:6px}
  .cmp-c .cv{font-size:26px;font-weight:800}
  .arrow{font-size:32px;color:#4ade80}
  .sav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
  .sav-c{background:#111d33;border-radius:8px;padding:14px;text-align:center;border:1px solid #1e3a5f}
  .sav-c .sl{font-size:10px;text-transform:uppercase;color:#64748b;margin-bottom:4px}
  .sav-c .sv{font-size:22px;font-weight:800;color:#4ade80}
  .funnel{display:flex;align-items:center;justify-content:center;margin:24px 0;gap:0}
  .funnel-s{text-align:center}
  .funnel-s .fb{height:56px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;border-radius:8px}
  .funnel-s .fl-l{font-size:11px;color:#94a3b8;margin-top:6px}
  .funnel-s .fl-p{font-size:10px;color:#64748b;margin-top:3px}
  .fa{font-size:24px;color:#1e3a5f;margin:0 8px}
  .roi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .roi-c{background:#111d33;border-radius:10px;padding:16px;text-align:center;border:1px solid #1e3a5f}
  .roi-c .rl{font-size:10px;text-transform:uppercase;color:#64748b;margin-bottom:4px}
  .roi-c .rv{font-size:24px;font-weight:800;color:#4ade80}
  .live{display:inline-block;width:8px;height:8px;background:#4ade80;border-radius:50%;margin-right:4px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .ft{text-align:center;margin-top:28px;padding-top:16px;border-top:1px solid #1e3a5f}
  .ft p{font-size:11px;color:#475569}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:8px}
  .legend span{font-size:11px;color:#64748b}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:3px}
  #content{min-height:400px}
  .loading{text-align:center;padding:80px;color:#64748b;font-size:16px}
</style>
</head>
<body>

<div class="nav">
  <button onclick="load('peak-season')" id="btn-peak-season">V5: Peak Season</button>
  <button onclick="load('claude-code')" id="btn-claude-code">V6: Claude Code</button>
  <button onclick="load('plumbing')" id="btn-plumbing">V7: Plumbing Leads</button>
  <button onclick="load('scheduling')" id="btn-scheduling">V8: Dispatch</button>
</div>

<div id="content"><div class="loading">Loading dashboard...</div></div>

<div class="ft"><p>AI Systems by Mohamed Elgazzar | AI for Contractors</p></div>

<script>
const SUPABASE_URL = 'https://gjyaplpthwbujuqrmden.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqeWFwbHB0aHdidWp1cXJtZGVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2OTYxMDQsImV4cCI6MjA4OTI3MjEwNH0.UrRD4OtP6zPT8VurhNWgpf1lQOZFoGwYrwvdEoErUwI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString();
let current = '';

function setActive(v) {
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  $('btn-' + v)?.classList.add('active');
}

async function load(v) {
  if (v === current) return;
  current = v;
  setActive(v);
  $('content').innerHTML = '<div class="loading">Loading...</div>';
  try {
    switch(v) {
      case 'peak-season': await peakSeason(); break;
      case 'claude-code': await claudeCode(); break;
      case 'plumbing': await plumbingLeads(); break;
      case 'scheduling': await dispatch(); break;
    }
  } catch(e) { $('content').innerHTML = '<div class="loading">Error: ' + e.message + '</div>'; }
}

async function peakSeason() {
  const { data: m } = await sb.from('monthly_performance').select('*').order('month_order');
  const totalRev = m.reduce((s, r) => s + Number(r.revenue_recovered), 0);
  const peakMax = m.reduce((mx, r) => Number(r.revenue_recovered) > Number(mx.revenue_recovered) ? r : mx, m[0]);
  const maxR = 38000;

  const bars = m.map(r => {
    const rev = Number(r.revenue_recovered);
    const h = rev > 0 ? Math.max(8, (rev / maxR) * 170) : 2;
    const bg = r.month_order <= 4 ? 'linear-gradient(180deg,#f87171,#991b1b)' : r.month_order === 5 ? 'linear-gradient(180deg,#fbbf24,#92400e)' : 'linear-gradient(180deg,#4ade80,#166534)';
    const label = rev > 0 ? '$' + (rev/1000).toFixed(0) + 'K' : '$0';
    const mn = r.month.split(' ')[0].substring(0,3);
    return `<div class="bar-col"><div class="bw"><div class="br" style="height:${h}px;background:${bg}"><span class="bl-t">${label}</span></div></div><span class="ml">${mn}</span></div>`;
  }).join('');

  const rows = m.map(r => {
    const bg = r.month_order === 5 ? ' style="background:#1a2744"' : '';
    const mc = r.miss_rate === '0%' ? 'g' : r.miss_rate === '10%' ? 'y' : 'r';
    const ahRev = Number(r.after_hours_revenue) > 0 ? `<span class="money">$${fmt(r.after_hours_revenue)}</span>` : '<span style="color:#475569">$0 (voicemail)</span>';
    return `<tr${bg}><td>${r.month}</td><td>${r.total_calls}</td><td style="color:${r.missed_calls > 0 ? '#f87171' : '#4ade80'}">${r.missed_calls}</td><td><span class="badge badge-${mc}">${r.miss_rate}</span></td><td>${r.ai_answered}</td><td class="money">${Number(r.revenue_recovered) > 0 ? '$'+fmt(r.revenue_recovered) : '$0'}</td><td>${ahRev}</td></tr>`;
  }).join('');

  $('content').innerHTML = `
    <div class="hdr"><h1>AI Phone System Performance Dashboard</h1><p>HVAC Company | Jan 2025 - Dec 2025 | AI Installed May 2025</p></div>
    <div class="kpi-row c4">
      <div class="kpi"><div class="lb">Total Revenue Recovered</div><div class="vl y">$${fmt(totalRev)}</div><div class="sub">Since AI installation (May 2025)</div></div>
      <div class="kpi"><div class="lb">Current Miss Rate</div><div class="vl g">0%</div><div class="sub">Down from 27% pre-AI</div></div>
      <div class="kpi"><div class="lb">Peak Month Revenue</div><div class="vl y">$${fmt(peakMax.revenue_recovered)}</div><div class="sub">${peakMax.month} (${peakMax.total_calls} calls)</div></div>
      <div class="kpi"><div class="lb">Avg Response Time</div><div class="vl g">2 sec</div><div class="sub">Down from 4-8 minutes</div></div>
    </div>
    <div class="sec"><h2>Monthly Revenue Recovered</h2><div class="chart">${bars}</div>
      <div class="legend"><span><span class="dot" style="background:#f87171"></span>Pre-AI</span><span><span class="dot" style="background:#fbbf24"></span>Transition</span><span><span class="dot" style="background:#4ade80"></span>AI Active</span></div>
    </div>
    <div class="sec"><h2>Monthly Breakdown</h2><table><thead><tr><th>Month</th><th>Calls</th><th>Missed</th><th>Rate</th><th>AI Answered</th><th>Revenue Recovered</th><th>After-Hours Rev</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="hbox"><div class="big">$${fmt(totalRev)}</div><div class="desc">Total Revenue Recovered in Year 1 | System Cost: $70-100/month | ROI: 1,296%</div></div>`;
}

  const { data: m } = await sb.from('monthly_performance').select('*').order('month_order');
  const totalRev = m.reduce((s, r) => s + Number(r.revenue_recovered), 0);

    const mc = r.miss_rate === '0%' ? 'g' : r.miss_rate === '10%' ? 'y' : 'r';
    return `<tr><td>${r.month}</td><td>${r.total_calls}</td><td><span class="badge badge-${mc}">${r.miss_rate}</span></td><td>${r.ai_answered}</td><td class="money">${Number(r.revenue_recovered) > 0 ? '$'+fmt(r.revenue_recovered) : '$0'}</td></tr>`;
  }).join('');

  $('content').innerHTML = `
    <div class="hdr"><h1>HVAC AI System Built with Claude Code</h1><p>Full CRM + Call Log + Revenue Tracker | Built in 10 minutes | Cost: &lt;$100/month</p></div>
    <div class="kpi-row c5">
      <div class="kpi"><div class="lb">Revenue Recovered</div><div class="vl y">$${fmt(totalRev)}</div><div class="sub">Year 1 total</div></div>
      <div class="kpi"><div class="lb">Build Time</div><div class="vl g">10 min</div><div class="sub">vs 40+ hours manual</div></div>
      <div class="kpi"><div class="lb">Monthly Cost</div><div class="vl w" style="font-size:28px">&lt; $100</div><div class="sub">VAPI + n8n + Airtable</div></div>

      <div class="kpi"><div class="lb">ROI</div><div class="vl y">1,296%</div><div class="sub">26-day payback</div></div>
    </div>
    <div class="sec"><h2>System Cost Breakdown</h2><div class="sav">
      <div class="sav-c"><div class="sl">VAPI (Voice AI)</div><div class="sv">$30/mo</div></div>
      <div class="sav-c"><div class="sl">n8n (Automation)</div><div class="sv">$20/mo</div></div>
      <div class="sav-c"><div class="sl">Airtable (CRM)</div><div class="sv">$20/mo</div></div>
      <div class="sav-c"><div class="sl">Total System</div><div class="sv" style="color:#FFF176">$70/mo</div></div>
    </div></div>

      <div class="cmp"><div class="cmp-c bad"><div class="cl">Manual Build</div><div class="cv r">40+ hours</div></div><div class="arrow">&rarr;</div><div class="cmp-c good"><div class="cl">Claude Code</div><div class="cv g">~10 min</div></div></div>
      <div class="cmp"><div class="cmp-c bad"><div class="cl">Receptionist Salary</div><div class="cv r">$45K/year</div></div><div class="arrow">&rarr;</div><div class="cmp-c good"><div class="cl">AI System</div><div class="cv g">$840/year</div></div></div>
    </div>
    <div class="sec"><h2>Monthly Performance (What Claude Code Built)</h2><table><thead><tr><th>Month</th><th>Total Calls</th><th>Miss Rate</th><th>AI Answered</th><th>Revenue Recovered</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="hbox"><div class="big">$${fmt(totalRev)} recovered</div><div class="desc">Entire system built with Claude Code in 10 minutes | Running cost: $70/month | ROI: 1,296%</div></div>`;
}

async function plumbingLeads() {
  const { data: leads } = await sb.from('plumbing_dead_leads').select('*');
  const booked = leads.filter(l => l.interested === 'Yes - Booked').sort((a,b) => Number(b.estimated_revenue) - Number(a.estimated_revenue));
  const bookedRows = booked.map(l => `<tr><td>${l.lead_name}</td><td>${l.service_requested}</td><td>${l.days_since_service} days</td><td class="money">$${fmt(l.estimated_revenue)}</td><td><span class="badge badge-g">Booked</span></td></tr>`).join('');

  $('content').innerHTML = `
    <div class="hdr"><h1>Dead Lead Revival Campaign Results</h1><p>Comfort Plumbing Co. | AI Outbound Calling Campaign | March 2026</p></div>
    <div class="kpi-row c5">
      <div class="kpi"><div class="lb">Total Leads Called</div><div class="vl w">500</div><div class="sub">Completed in 1 day</div></div>
      <div class="kpi"><div class="lb">Leads Reached</div><div class="vl b">312</div><div class="sub">62% reach rate</div></div>
      <div class="kpi"><div class="lb">Appointments Booked</div><div class="vl g">47</div><div class="sub">15% of reached</div></div>
      <div class="kpi"><div class="lb">Revenue Recovered</div><div class="vl y">$47,000</div><div class="sub">Avg $1,000/job</div></div>
      <div class="kpi"><div class="lb">Campaign Cost</div><div class="vl w" style="font-size:26px">$200</div><div class="sub">$0.40 per call</div></div>
    </div>
    <div class="sec"><h2>Campaign Funnel</h2><div class="funnel">
      <div class="funnel-s"><div class="fb" style="width:260px;background:linear-gradient(135deg,#3b82f6,#1d4ed8)">500</div><div class="fl-l">Dead Leads</div><div class="fl-p">100%</div></div>
      <div class="fa">&rarr;</div>
      <div class="funnel-s"><div class="fb" style="width:200px;background:linear-gradient(135deg,#60a5fa,#2563eb)">312</div><div class="fl-l">Reached</div><div class="fl-p">62%</div></div>
      <div class="fa">&rarr;</div>
      <div class="funnel-s"><div class="fb" style="width:130px;background:linear-gradient(135deg,#fbbf24,#d97706)">78</div><div class="fl-l">Interested</div><div class="fl-p">25%</div></div>
      <div class="fa">&rarr;</div>
      <div class="funnel-s"><div class="fb" style="width:90px;background:linear-gradient(135deg,#4ade80,#16a34a)">47</div><div class="fl-l">Booked</div><div class="fl-p">15%</div></div>
    </div></div>
    <div class="two"><div class="sec"><h2>Booked Appointments (Sample)</h2><table><thead><tr><th>Customer</th><th>Service</th><th>Days Since Visit</th><th>Revenue</th><th>Status</th></tr></thead><tbody>${bookedRows}</tbody></table><p style="font-size:11px;color:#475569;margin-top:6px">Showing ${booked.length} of 47 booked (sample from first 100 leads)</p></div>
    <div><div class="sec"><h2>Campaign ROI</h2><div class="roi">
      <div class="roi-c"><div class="rl">Cost</div><div class="rv" style="color:#f87171">$200</div></div>
      <div class="roi-c"><div class="rl">Revenue</div><div class="rv">$47,000</div></div>
      <div class="roi-c"><div class="rl">ROI</div><div class="rv">23,400%</div></div>
    </div></div>
    <div class="sec"><h2>Annual Projection (4x/year)</h2><div class="roi">
      <div class="roi-c"><div class="rl">Per Campaign</div><div class="rv">$47K</div></div>
      <div class="roi-c"><div class="rl">Annual</div><div class="rv">$188K</div></div>
      <div class="roi-c"><div class="rl">Annual Cost</div><div class="rv" style="color:#f87171">$800</div></div>
    </div></div></div></div>
    <div class="hbox"><div class="big">$47,000 from dead leads</div><div class="desc">500 calls in 1 day | $200 total cost | 23,400% ROI | Run quarterly for $188K/year</div></div>`;

async function dispatch() {
  const { data: techs } = await sb.from('technician_dispatch').select('*').order('utilization', { ascending: false });
  const { data: sched } = await sb.from('daily_schedule').select('*');
  const s = sched.sort((a,b) => a.time_slot.localeCompare(b.time_slot));
  const totalRev = s.reduce((sum, r) => sum + Number(r.revenue), 0);
  const activeTechs = techs.filter(t => t.status !== 'Off Duty').length;

  const statusMap = {'On Job':'o','Driving':'b','Available':'g','Break':'y','Off Duty':'gr'};
  const techRows = techs.map(r => {
    const u = parseInt(r.utilization) || 0;
    const uc = u >= 85 ? '#4ade80' : u >= 70 ? '#60a5fa' : u > 0 ? '#fbbf24' : '#64748b';
    return `<tr><td><strong>${r.tech_name}</strong></td><td><span class="badge badge-${statusMap[r.status]||'gr'}">${r.status}</span></td><td>${r.jobs_today}</td><td>${r.avg_drive_time}</td><td style="color:${uc};font-weight:700">${r.utilization}</td></tr>`;
  }).join('');

  const utilBars = techs.filter(t => t.status !== 'Off Duty').map(r => {
    const p = parseInt(r.utilization) || 0;
    const bg = p >= 85 ? 'linear-gradient(90deg,#4ade80,#16a34a)' : p >= 70 ? 'linear-gradient(90deg,#60a5fa,#2563eb)' : 'linear-gradient(90deg,#fbbf24,#d97706)';
    return `<div class="util-bar"><span class="nm">${r.tech_name}</span><div class="bg"><div class="fl" style="width:${p}%;background:${bg}">${r.utilization}</div></div></div>`;
  }).join('');

  const sm = {'Completed':'g','In Progress':'y','Scheduled':'b','Rescheduled':'r'};
  const schedRows = s.map(r => `<tr><td>${r.time_slot}</td><td>${r.customer}</td><td>${r.assigned_tech}</td><td>${r.service_type}</td><td>${r.route_order}</td><td>${Number(r.revenue) > 0 ? '<span class="money">$'+fmt(r.revenue)+'</span>' : '<span style="color:#64748b">TBD</span>'}</td><td><span class="badge badge-${sm[r.status]||'gr'}">${r.status}</span></td></tr>`).join('');

  $('content').innerHTML = `
    <div class="hdr"><h1><span class="live"></span> HVAC Technician Dispatch Dashboard</h1><p>OpenClaw AI Scheduling | Today: March 17, 2026 | ${activeTechs} Technicians Active</p></div>
    <div class="kpi-row c5">
      <div class="kpi"><div class="lb">Today's Jobs</div><div class="vl w">${s.length}</div><div class="sub">Across ${activeTechs} technicians</div></div>
      <div class="kpi"><div class="lb">Today's Revenue</div><div class="vl y">$${fmt(totalRev)}</div><div class="sub">Avg $${Math.round(totalRev/s.length)}/job</div></div>
      <div class="kpi"><div class="lb">Avg Drive Time</div><div class="vl g">18 min</div><div class="sub">Down from 45 min</div></div>
      <div class="kpi"><div class="lb">Jobs/Tech/Day</div><div class="vl b">${(s.length / activeTechs).toFixed(1)}</div><div class="sub">Up from 1.8 avg</div></div>
      <div class="kpi"><div class="lb">Schedule Conflicts</div><div class="vl g">0</div><div class="sub">AI auto-resolved</div></div>
    </div>
    <div class="two">
      <div class="sec"><h2><span class="live"></span> Technician Status Board</h2><table><thead><tr><th>Tech</th><th>Status</th><th>Jobs</th><th>Drive Time</th><th>Utilization</th></tr></thead><tbody>${techRows}</tbody></table></div>
      <div><div class="sec"><h2>Team Utilization</h2>${utilBars}</div>
        <div class="sec"><h2>Before vs After OpenClaw</h2>
